name = "dungeons-leaderboard"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
# REQUIRED. The worker treats a missing value as a misconfiguration and sends no
# CORS headers at all, so leaving it unset breaks the leaderboard in the browser.
# "*" is fine because the API uses no cookies or credentials; to restrict it,
# use a comma-separated list, e.g. "https://<user>.github.io,http://localhost:5173".
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "dungeons-leaderboard"
# Still a placeholder because this project's worker was deployed through the
# Cloudflare dashboard, not the CLI — so nothing has ever needed it. Before any
# wrangler command will work, replace it with the real id: `npx wrangler d1 list`
# prints it for an existing database, `d1 create` prints it for a new one.
database_id = "PASTE_DATABASE_ID_HERE"
