name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages. GitHub Pages only
# serves static files, so the site must be built here first — the raw source
# (bare `import 'phaser'`) cannot run in a browser unbundled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The full gate, not a subset. test.yml only triggers on pull requests,
      # so a direct push to main is deployed by this workflow alone — if it ran
      # `check` only, a Phaser, input, or service-worker regression that the PR
      # campaign would have caught could still be published. `check:full` is
      # check (lint, format, unit, build, bundle budget) plus the browser
      # campaign, and it ends in the very build that gets uploaded.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium

      - run: npm run check:full
      - run: npm run test:coverage

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-deploy
          path: e2e/.artifacts/
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages and set its source to GitHub Actions automatically.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
